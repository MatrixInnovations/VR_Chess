name: CI

on:
  pull_request:
  push:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Chess/3d-chess-vr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Chess/3d-chess-vr/package-lock.json
      - name: Pin npm
        run: npm install -g npm@10.9.2
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Test and coverage
        run: npx vitest run --coverage
      - name: Fridae clock coverage
        working-directory: fridae-clock
        run: npm ci && npm run typecheck && npm run test:coverage
      - name: Build
        run: npm run build
      - name: Browser smoke
        run: npx playwright install --with-deps chromium && npx playwright test -c playwright.prod.config.ts && npx playwright test -c playwright.shipped.config.ts && npx playwright test
